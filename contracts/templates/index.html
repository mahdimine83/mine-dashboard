<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Management</title>
</head>
<body>
    <h1>Contracts</h1>
    <a href="{{ url_for('add_contract') }}">Add New Contract</a>
    <table border="1">
        <thead>
            <tr>
                <th>Client Name</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for contract in contracts %}
            <tr>
                <td>{{ contract.client_name }}</td>
                <td>{{ contract.start_date }}</td>
                <td>{{ contract.end_date }}</td>
                <td>{{ contract.amount }}</td>
                <td>{{ contract.status }}</td>
                <td>
                    <a href="{{ url_for('edit_contract', contract_id=contract.id) }}">Edit</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
